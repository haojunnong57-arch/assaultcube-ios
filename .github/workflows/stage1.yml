name: Stage1 iOS deps (arm64)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  IOS_MIN: "17.0"

jobs:
  stage1:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Init log
        run: |
          echo "=== run $GITHUB_RUN_ID $(date -u) ===" > build.log
          bash ci-step.sh "Toolchain" bash -c 'xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version; clang --version'

      - name: Clone SDL2
        run: bash ci-step.sh "Clone SDL2" git clone --depth 1 -b SDL2 https://github.com/libsdl-org/SDL.git sdl

      - name: Configure SDL2
        run: >
          bash ci-step.sh "Configure SDL2" cmake -S sdl -B sdl-build -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=${IOS_MIN}
          -DCMAKE_INSTALL_PREFIX=$PWD/prefix
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TEST=OFF -DSDL_TESTS=OFF

      - name: Build SDL2
        run: bash ci-step.sh "Build SDL2" cmake --build sdl-build --config Release -- -sdk iphoneos

      - name: Install SDL2
        run: bash ci-step.sh "Install SDL2" cmake --install sdl-build --config Release

      - name: Clone GL4ES
        run: bash ci-step.sh "Clone GL4ES" git clone --depth 1 https://github.com/ptitSeb/gl4es.git gl4es

      - name: Patch GL4ES for Apple
        run: bash ci-step.sh "Patch GL4ES" bash -c "sed -i '' 's|#ifdef __GNUC__|#if defined(__GNUC__) \\&\\& !defined(__APPLE__)|' gl4es/src/gl/attributes.h && grep -n 'defined(__GNUC__)' gl4es/src/gl/attributes.h"

      - name: Configure GL4ES
        run: >
          bash ci-step.sh "Configure GL4ES" cmake -S gl4es -B gl4es-build -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=${IOS_MIN}
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          -DCMAKE_BUILD_TYPE=Release

      - name: Build GL4ES
        run: bash ci-step.sh "Build GL4ES" cmake --build gl4es-build --config Release -- -sdk iphoneos

      - name: Clone SDL2_image
        run: bash ci-step.sh "Clone SDL2_image" git clone --depth 1 -b SDL2 https://github.com/libsdl-org/SDL_image.git sdl_image

      - name: Configure SDL2_image
        run: >
          bash ci-step.sh "Configure SDL2_image" cmake -S sdl_image -B simg-build -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=${IOS_MIN}
          -DCMAKE_INSTALL_PREFIX=$PWD/prefix
          -DCMAKE_PREFIX_PATH=$PWD/prefix
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          -DSDL2_INCLUDE_DIR=$PWD/prefix/include/SDL2
          -DSDL2_LIBRARY=$PWD/prefix/lib/libSDL2.a
          -DBUILD_SHARED_LIBS=OFF
          -DSDL2IMAGE_VENDORED=ON
          -DSDL2IMAGE_TIF=OFF -DSDL2IMAGE_WEBP=OFF -DSDL2IMAGE_AVIF=OFF -DSDL2IMAGE_JXL=OFF

      - name: Build SDL2_image
        run: bash ci-step.sh "Build SDL2_image" cmake --build simg-build --config Release -- -sdk iphoneos

      - name: Install SDL2_image
        run: bash ci-step.sh "Install SDL2_image" cmake --install simg-build --config Release

      - name: Clone libogg
        run: bash ci-step.sh "Clone libogg" git clone --depth 1 https://github.com/xiph/ogg.git ogg

      - name: Configure libogg
        run: >
          bash ci-step.sh "Configure libogg" cmake -S ogg -B ogg-build -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=${IOS_MIN}
          -DCMAKE_INSTALL_PREFIX=$PWD/prefix
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          -DBUILD_SHARED_LIBS=OFF -DINSTALL_DOCS=OFF

      - name: Build libogg
        run: bash ci-step.sh "Build libogg" cmake --build ogg-build --config Release -- -sdk iphoneos

      - name: Install libogg
        run: bash ci-step.sh "Install libogg" cmake --install ogg-build --config Release

      - name: Clone libvorbis
        run: bash ci-step.sh "Clone libvorbis" git clone --depth 1 https://github.com/xiph/vorbis.git vorbis

      - name: Configure libvorbis
        run: >
          bash ci-step.sh "Configure libvorbis" cmake -S vorbis -B vorbis-build -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=${IOS_MIN}
          -DCMAKE_INSTALL_PREFIX=$PWD/prefix
          -DCMAKE_PREFIX_PATH=$PWD/prefix
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          -DOGG_INCLUDE_DIR=$PWD/prefix/include
          -DOGG_LIBRARY=$PWD/prefix/lib/libogg.a
          -DBUILD_SHARED_LIBS=OFF

      - name: Build libvorbis
        run: bash ci-step.sh "Build libvorbis" cmake --build vorbis-build --config Release -- -sdk iphoneos

      - name: Install libvorbis
        run: bash ci-step.sh "Install libvorbis" cmake --install vorbis-build --config Release

      - name: Clone OpenAL-Soft
        run: bash ci-step.sh "Clone OpenAL-Soft" git clone --depth 1 https://github.com/kcat/openal-soft.git openal-soft

      - name: Configure OpenAL-Soft
        run: >
          bash ci-step.sh "Configure OpenAL-Soft" cmake -S openal-soft -B oal-build -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=${IOS_MIN}
          -DCMAKE_INSTALL_PREFIX=$PWD/prefix
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          -DLIBTYPE=STATIC -DALSOFT_EXAMPLES=OFF -DALSOFT_TESTS=OFF -DALSOFT_UTILS=OFF

      - name: Build OpenAL-Soft
        run: bash ci-step.sh "Build OpenAL-Soft" cmake --build oal-build --config Release -- -sdk iphoneos

      - name: Install OpenAL-Soft
        run: bash ci-step.sh "Install OpenAL-Soft" cmake --install oal-build --config Release

      - name: List artifacts
        run: bash ci-step.sh "Artifacts" bash -c 'find . -name "*.a" -path "*Release*" -exec ls -lh {} \; | head -60; echo; ls -R prefix/lib 2>/dev/null | head -40'

      - name: Upload log to build-logs branch
        if: always()
        run: |
          git config user.name ci-bot
          git config user.email ci-bot@users.noreply.github.com
          git fetch origin build-logs || true
          if git rev-parse --verify origin/build-logs >/dev/null 2>&1; then
            git checkout build-logs
            git reset --hard origin/build-logs
          else
            git checkout --orphan build-logs
          fi
          git rm -r -f --ignore-unmatch . 2>/dev/null || true
          cp build.log run.log
          git add -f run.log
          git commit -m "run $GITHUB_RUN_NUMBER" --allow-empty
          git push origin build-logs --force
